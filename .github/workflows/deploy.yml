name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - name: Upload jar and restart
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          JAR=$(ls notification-service/build/libs/*.jar | grep -v -- '-plain')
          scp -i ~/.ssh/id_deploy "$JAR" "$TARGET:/tmp/notification-service.jar"
          # 직전 jar를 .prev로 남겨 수동 롤백할 수 있게 한다.
          $SSH "$TARGET" 'set -e
            sudo cp -f /opt/desyp/notification-service.jar /opt/desyp/notification-service.jar.prev 2>/dev/null || true
            sudo install -o desyp -g desyp -m 644 /tmp/notification-service.jar /opt/desyp/notification-service.jar
            sudo systemctl restart desyp-notification'
          # 비로그인 /api/me가 401이면 기동 완료로 본다.
          for i in $(seq 1 45); do
            code=$($SSH "$TARGET" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/me" || true)
            [ "$code" = 401 ] && echo "started" && exit 0
            sleep 2
          done
          $SSH "$TARGET" 'sudo journalctl -u desyp-notification -n 50 --no-pager'
          exit 1
