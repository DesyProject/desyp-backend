spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/desyp}
    username: ${DB_USERNAME:desyp}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
logging:
  level:
    # UNIQUE 위반의 DB 오류 메시지에 이메일·휴대전화번호·소셜 식별자가 포함될 수 있다.
    org.hibernate.orm.jdbc.error: OFF
desyp:
  admin:
    naver-account-ids: ${ADMIN_NAVER_ACCOUNT_IDS:}
  mail:
    sender-email: ${SES_SENDER_EMAIL:}
