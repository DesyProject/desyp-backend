spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/desyp}
    username: ${DB_USERNAME:desyp}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      # 스키마는 Flyway V7이 관리한다.
      initialize-schema: never
server:
  # API Gateway·Lambda 뒤에서 X-Forwarded-* 헤더로 외부 주소를 복원한다.
  # 네이버 redirect-uri의 {baseUrl}이 https://api.desyp.site가 되어야 로그인이 된다.
  forward-headers-strategy: framework
logging:
  level:
    # UNIQUE 위반의 DB 오류 메시지에 이메일·휴대전화번호·소셜 식별자가 포함될 수 있다.
    org.hibernate.orm.jdbc.error: OFF
desyp:
  admin:
    naver-account-ids: ${ADMIN_NAVER_ACCOUNT_IDS:}
  mail:
    sender-email: ${SES_SENDER_EMAIL:}
  frontend:
    # 로그인 후 return_to 허용 범위와 CORS 허용 Origin. 로컬 개발은 http://localhost:5173
    origin: ${FRONTEND_ORIGIN:https://www.desyp.site}
  registration:
    end-at: ${REGISTRATION_END_AT:2026-10-14T23:59:59+09:00}
