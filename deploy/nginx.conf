# /etc/nginx/conf.d/desyp-api.conf
# Spring Boot는 127.0.0.1:8080에만 바인딩하고 외부 요청은 이 Nginx만 받는다.

limit_req_zone $binary_remote_addr zone=desyp_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=desyp_register:10m rate=1r/s;
limit_req_status 429;

server {
    listen 80;
    server_name api.desyp.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.desyp.site;

    ssl_certificate /etc/letsencrypt/live/api.desyp.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.desyp.site/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16k;

    # 클라이언트가 보낸 X-Forwarded-* 값을 덮어써 위조를 막는다.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/pre-registrations {
        limit_req zone=desyp_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=desyp_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
}
